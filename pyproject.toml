[project]
name = "finetune-lib"
version = "1.4.0"
description = "Cross-project LoRA toolkit for continual pretraining and SFT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "transformers==5.5.0",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "datasets==4.3.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "huggingface-hub==1.26.0",
    "safetensors==0.8.0",
    "liger-kernel==0.8.1",
]

[project.optional-dependencies]
unsloth = [
    "unsloth==2026.7.6",
    "torchao==0.17.0; sys_platform == 'linux'",
    "torchvision==0.26.0",
]
eight-bit = ["bitsandbytes==0.49.2"]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.0",
    "mypy==1.20.2",
    "types-PyYAML==6.0.12.20260724",
]
flash = [
    "flash-attn",
]
tracking = ["wandb>=0.19.0"]

[project.scripts]
finetune-lib = "finetune_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune_library"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchao = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
flash-attn = { url = "https://github.com/lesj0610/flash-attention/releases/download/v2.8.3-cu12-torch2.11/flash_attn-2.8.3%2Bcu12torch2.11cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".cache",
    ".conda",
    ".venv",
    "data",
    "logs",
    "outputs",
    "unsloth_compiled_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.0",
    "mypy==1.20.2",
    "types-PyYAML==6.0.12.20260724",
]
