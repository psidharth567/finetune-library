version: 1
task: sft
model:
  name: qwen3-8b
data:
  format: messages
  path: data/dummy_sft.jsonl
  cache_dir: .cache/prepared
  # Whole examples are bin-packed into windows of <= max_seq_length tokens and
  # isolated from each other (packing_isolation resolves to attention).
  # Examples longer than max_seq_length are dropped, never truncated.
  packing: true
  sft_overlength: drop
training:
  output_dir: outputs/qwen3-8b-sft-packed
  max_seq_length: 8192
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 10
  log_every_steps: 1
lora: {rank: 32, alpha: 64, dropout: 0.0, expert_rank: 4}
optimizer:
  name: adamw
  learning_rate: 0.0002
scheduler: {name: cosine, warmup_ratio: 0.03}
distributed: {strategy: ddp}
runtime:
  backend: native
  attention: sdpa
  model_kernels: auto
  loss: fused_linear_cross_entropy
  experts: eager
  torch_compile: false
  gradient_checkpointing: false
checkpoint: {save_every_steps: 0, save_final: true}
