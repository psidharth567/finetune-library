version: 1
task: cpt
model:
  name: qwen3-8b
  cache_dir: /projects/data/llmteam/sidharth/toolkit/finetune-library/.cache/huggingface
data:
  format: text
  path: data/cpt_train_longest_20k/train_packed_2048.jsonl
  cache_dir: .cache/benchmark-prepared
  max_samples: 2
  packing: true
  drop_remainder: true
training:
  output_dir: outputs/tiny-qwen
  max_seq_length: 512
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 3
  log_every_steps: 1
  benchmark_warmup_steps: 1
  benchmark_steps: 1
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  expert_rank: 4
optimizer:
  name: adamw
  learning_rate: 0.0002
scheduler:
  name: cosine
  warmup_ratio: 0.03
distributed:
  strategy: ddp
runtime:
  backend: native
  attention: sdpa
  model_kernels: native
  loss: fused_linear_cross_entropy
  experts: eager
  torch_compile: false
  gradient_checkpointing: false
checkpoint:
  save_every_steps: 0
  save_final: false
