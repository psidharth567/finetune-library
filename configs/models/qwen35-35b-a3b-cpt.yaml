version: 1
task: cpt
model:
  name: qwen3.5-35b-a3b
data:
  format: text
  path: data/dummy_cpt.jsonl
  cache_dir: .cache/prepared
  packing: true
  drop_remainder: true
training:
  output_dir: outputs/qwen35-35b-cpt
  max_seq_length: 2048
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 500
  log_every_steps: 10
  dataloader_workers: 4
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  expert_rank: 4
optimizer:
  name: adamw
  learning_rate: 0.0002
scheduler:
  name: cosine
  warmup_ratio: 0.03
distributed:
  strategy: fsdp
  expert_parallel_size: 4
runtime:
  backend: native
  attention: flash_attention_3
  model_kernels: native
  loss: fused_linear_cross_entropy
  experts: grouped_mm
  moe_a2a_backend: native
  torch_compile: false
  gradient_checkpointing: true
  use_cache: false
checkpoint:
  save_every_steps: 100
  save_final: true
