version: 1
task: cpt
model:
  name: qwen3-14b
data:
  format: text
  path: data/dummy_cpt.jsonl
  cache_dir: .cache/prepared
  packing: true
  drop_remainder: false
training:
  output_dir: outputs/qwen3-14b-cpt
  max_seq_length: 2048
  per_device_batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 10
  log_every_steps: 1
lora:
  rank: 32
  alpha: 64
  dropout: 0.0
  expert_rank: 4
optimizer:
  name: adamw
  learning_rate: 0.0002
scheduler:
  name: cosine
  warmup_ratio: 0.03
distributed:
  strategy: ddp
runtime:
  backend: native
  attention: sdpa
  model_kernels: auto
  loss: fused_linear_cross_entropy
  experts: auto
  torch_compile: false
  gradient_checkpointing: false
  use_cache: false
checkpoint:
  save_every_steps: 0
  save_final: true
